<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortnite YouTube Thumbnails | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="#contact" class="sticky-cta" id="stickyCta">Hire me</a>

<section class="hero">
  <h1>Fortnite YouTube Thumbnails</h1>

  <div class="stats">
    <span>⚡ 24h Delivery</span>
    <span>🎯 High CTR</span>
    <span>📁 PSD + BLEND</span>
  </div>

  <!-- BEFORE / AFTER -->
  <div class="ba-wrapper">
    <div class="ba-hover" id="baHover">
      <img class="ba-base" id="baBase">
      <img class="ba-top" id="baTop">
      <div class="ba-line" id="baLine"></div>
    </div>
  </div>

  <!-- RANDOM PREVIEW -->
  <div class="preview-bar">
    <div class="preview" id="preview"></div>

    <!-- CHANGE RANDOM -->
    <img
      src="images/btn_change.png"
      id="refreshBtn"
      class="change-btn"
      alt="Change thumbnails"
    />
  </div>

  <!-- VIEW / HIDE PORTFOLIO -->
  <img
    id="toggleBtn"
    class="toggle-btn"
    src="images/btn_view.png"
    alt="Toggle portfolio"
    onclick="togglePortfolio()"
  />
</section>

<!-- PORTFOLIO -->
<section id="portfolio" class="portfolio hidden">
  <div class="grid" id="grid">
    <img src="images/t1_after.png">
    <img src="images/t2_after.png">
    <img src="images/t3_after.png">
    <img src="images/t4_after.png">
    <img src="images/t5_after.png">
    <img src="images/t6_after.png">
    <img src="images/t7_after.png">
    <img src="images/t8_after.png">
    <img src="images/t9_after.png">
  </div>
</section>

<!-- CTA -->
<section class="cta" id="contact">
  <a href="http://www.fiverr.com/s/bdAZKQk" target="_blank">
    <img src="images/btn_fiverr.png" class="cta-img" alt="Fiverr">
  </a>
  <a href="https://discord.gg/4ZXZ9DrS" target="_blank">
    <img src="images/btn_discord.png" class="cta-img" alt="Discord">
  </a>
</section>

<script>
/* STICKY CTA */
const stickyCta = document.getElementById("stickyCta");
window.addEventListener("scroll", () => {
  stickyCta.classList.toggle("show", window.scrollY > 400);
});

/* THUMBNAILS */
const thumbnails = [
  "images/t1_after.png","images/t2_after.png","images/t3_after.png",
  "images/t4_after.png","images/t5_after.png","images/t6_after.png",
  "images/t7_after.png","images/t8_after.png","images/t9_after.png"
];

/* SHUFFLE */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* SET BEFORE / AFTER */
function setImages(afterSrc) {
  const beforeSrc = afterSrc.replace("_after", "_before");
  baTop.src = afterSrc;
  baBase.src = beforeSrc;
  target = 50;
  lastMove = Date.now();
}

/* LOAD PREVIEW (ANIMACIÓN ESTABLE) */
function loadPreview() {
  preview.innerHTML = "";
  const shuffled = [...thumbnails];
  shuffle(shuffled);

  shuffled.slice(0,3).forEach((src, i) => {
    const card = document.createElement("div");
    card.className = "thumb-card";

    const img = document.createElement("img");
    img.src = src;
    img.classList.add(`thumb-${i}`);
    img.onclick = () => setImages(src);

    card.appendChild(img);
    preview.appendChild(card);
  });
}

/* CHANGE BUTTON */
refreshBtn.onclick = loadPreview;

/* TOGGLE PORTFOLIO */
let isOpen = false;
function togglePortfolio() {
  if (!isOpen) {
    portfolio.classList.remove("hidden");
    preview.classList.add("hidden");
    toggleBtn.src = "images/btn_hide.png";
    portfolio.scrollIntoView({ behavior: "smooth" });
  } else {
    portfolio.classList.add("hidden");
    preview.classList.remove("hidden");
    toggleBtn.src = "images/btn_view.png";
    loadPreview();
  }
  isOpen = !isOpen;
}

/* GRID CLICK */
grid.onclick = e => {
  if (e.target.tagName === "IMG") {
    setImages(e.target.src);
    document.querySelector(".hero")
      .scrollIntoView({ behavior: "smooth" });
  }
};

/* BEFORE / AFTER ANIMATION */
let target = 50, current = 50, lastMove = Date.now();

function animate() {
  current += (target - current) * 0.12;
  baTop.style.clipPath =
    `polygon(0 0, ${current}% 0, ${current}% 100%, 0 100%)`;
  baLine.style.left = current + "%";

  if (Date.now() - lastMove > 2000) {
    target = 50 + Math.sin(Date.now() / 800) * 20;
  }
  requestAnimationFrame(animate);
}

baHover.onmousemove = e => {
  const r = baHover.getBoundingClientRect();
  target = ((e.clientX - r.left) / r.width) * 100;
  lastMove = Date.now();
};

baHover.onmouseleave = () => target = 50;

/* INIT */
setImages(thumbnails[Math.floor(Math.random() * thumbnails.length)]);
animate();
loadPreview();
</script>

</body>
</html>
